<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini R4: จากบล็อกสู่โค้ด — เรียน MATRIXblock คู่ Arduino</title>
<meta name="description" content="สื่อการสอน MATRIXblock Mini R4 เรียนบล็อกควบคู่กับโค้ด Arduino C++ ไลบรารี MatrixMiniR4.h">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='26' height='18' rx='4' fill='%2300878F'/%3E%3Crect x='32' y='32' width='26' height='18' rx='4' fill='%2310282C'/%3E%3Cpath d='M32 23h6v18' stroke='%23FFC857' stroke-width='5' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F2F5F5; --paper:#FFFFFF; --ink:#10282C; --muted:#56696D; --line:#D9E2E3;
  --teal:#00878F; --teal-d:#006A71; --amber:#FFC857; --amber-d:#B98300;
  --code-bg:#0D2226; --code-ink:#D6E6E8; --code-hl:#1E474D;
  --sans:"IBM Plex Sans Thai","Noto Sans Lao","Noto Sans Thai","Phetsarath OT","Saysettha OT","Sarabun","Leelawadee UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--sans)}
a{color:var(--teal-d)}
code{font-family:var(--mono);font-size:.88em;background:#E6EEEF;border-radius:5px;padding:1px 6px;color:#0B4F55}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber-d);outline-offset:2px;border-radius:6px}

/* ---------- โครงหน้า ---------- */
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:18px 14px 30px}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:4px 6px 14px}
.brand svg{flex:none}
.brand b{display:block;font-size:17px;line-height:1.25}
.brand span{font-size:12.5px;color:var(--muted)}
.nav-top{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.side a.navi{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:8px;font-size:14.5px;line-height:1.35}
.side a.navi:hover{background:#EEF4F4}
.side a.navi.on{background:#DDEFF0;font-weight:600}
.side a.navi .ck{margin-left:auto;color:var(--teal);font-size:13px}
.unit-h{display:flex;align-items:center;gap:8px;margin:16px 6px 4px;font-size:13px;font-weight:700;color:var(--muted)}
.unit-h i{width:10px;height:10px;border-radius:50%;background:var(--u)}
.unit-h small{font-weight:500;margin-left:auto;font-size:11.5px}
.lang{display:flex;gap:4px;margin:14px 6px 0;font-size:13px;align-items:center;color:var(--muted)}
.lang button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 9px;cursor:pointer}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sitelang{display:flex;gap:3px;margin:2px 4px 14px;padding:3px;background:#E8F0F0;border-radius:10px}
.sitelang button{flex:1;border:0;background:transparent;border-radius:8px;padding:5px 4px;cursor:pointer;font-size:14px;line-height:1.3;color:var(--muted)}
.sitelang button:hover{color:var(--ink)}
.sitelang button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.lonote{margin:6px 8px 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.burger{display:none}
main{min-width:0;padding:28px clamp(16px,4vw,48px) 80px}
.wrap{max-width:1040px;margin:0 auto}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 25% 0 0;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .burger{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 14px}
  .burger button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;cursor:pointer}
  main{padding-top:16px}
}

/* ---------- ตัวอักษร ---------- */
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.25;margin:4px 0 10px;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.3;margin:42px 0 12px}
h3{font-size:18px;margin:0 0 4px}
p{margin:8px 0}
.crumb{font-size:14px;color:var(--muted)}
.crumb a{color:var(--muted)}
.lead{font-size:17.5px;max-width:70ch}
.goals{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:10px;padding:10px 18px;margin:16px 0}
.goals ul{margin:4px 0;padding-left:20px}
.rcrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:4px 0 8px}
.rcbtn{display:inline-flex;align-items:center;gap:8px;background:var(--u,#7A5CD6);color:#fff;text-decoration:none;font-weight:600;border-radius:10px;padding:8px 16px;box-shadow:0 6px 16px -10px var(--u,#7A5CD6)}
.rcbtn:hover{filter:brightness(1.08)}
.rcbtn svg{flex:none}

/* ---------- บล็อก ---------- */
.canvas{background-color:#F9FBFB;background-image:radial-gradient(#D4DFE0 1px,transparent 1.2px);background-size:18px 18px;padding:18px;overflow:auto}
.stack{display:flex;flex-direction:column;align-items:flex-start}
.blk{--c:#888;--c3:rgba(0,0,0,.25);display:inline-flex;flex-direction:column;color:#fff;font:600 12.5px/1.25 var(--sans);position:relative;cursor:default;transition:filter .12s}
.part{background:var(--c);border:1px solid var(--c3);display:flex;align-items:center;flex-wrap:nowrap;gap:5px;white-space:nowrap;padding:7px 10px;min-height:38px;position:relative}
.blk.stack-b>.part:first-child,.blk.cap>.part:first-child{border-radius:6px 6px 6px 6px}
.blk.c-b>.part.head{border-radius:6px 6px 0 6px}
.blk.c-b>.part.mid{border-radius:0 6px 6px 0}
.blk.c-b>.part.foot{border-radius:0 0 6px 6px;min-height:16px;padding:0}
.blk.hat>.part.head{border-radius:26px 26px 6px 0;padding-top:12px}
.mouth{display:flex}
.mouth .arm{width:16px;background:var(--c);border-left:1px solid var(--c3);flex:none}
.mouth .inner{padding:3px 0 3px 2px;min-height:28px;min-width:60px}
.blk.stack-b+.blk,.mouth .inner>.blk+.blk{margin-top:-1px}
.blk.rep>.part{border-radius:999px;min-height:30px;padding:4px 10px}
.blk.bool>.part{border:none;min-height:30px;padding:4px 18px;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%)}
.lbl{white-space:nowrap}
.fld{background:#fff;color:#2b2b2b;border-radius:999px;padding:1px 9px;min-width:26px;text-align:center;font-weight:500;border:1px solid rgba(0,0,0,.12)}
.dd{background:rgba(0,0,0,.16);border:1px solid rgba(0,0,0,.12);border-radius:7px;padding:1px 7px;white-space:nowrap}
.dd::after{content:" ▾";font-size:10px;opacity:.8}
.slot{display:inline-block;width:40px;height:22px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.15)}
.slot.b{background:rgba(0,0,0,.2);border:none;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%)}
.ico{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.18);font-size:12px;margin-right:2px}
.blk.hl>.part,.blk.hl>.mouth .arm{filter:brightness(1.08);box-shadow:0 0 0 3px var(--amber) inset}
.blk.hl.rep>.part,.blk.hl.bool>.part{box-shadow:0 0 0 3px var(--amber)}
.blk.hl.bool>.part{filter:drop-shadow(0 0 2px var(--amber)) brightness(1.12)}

/* ---------- สะพาน บล็อก ↔ โค้ด ---------- */
.bridge{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);border-radius:14px;overflow:hidden;border:1px solid #C9D6D8;background:var(--code-bg);margin:14px 0 8px;box-shadow:0 10px 30px -18px rgba(16,40,44,.5)}
.bridge .canvas{border-right:1px solid #C9D6D8;min-height:120px}
.codebox{position:relative;min-width:0;display:flex;flex-direction:column}
.codebar{display:flex;align-items:center;gap:8px;padding:8px 12px;color:#9DB8BC;font:500 12.5px var(--mono);border-bottom:1px solid #1C3A3F}
.codebar .sp{flex:1}
.codebar button{background:#16343A;border:1px solid #2A5158;color:#D6E6E8;border-radius:7px;padding:3px 10px;cursor:pointer;font:500 12.5px var(--sans)}
.codebar button:hover{background:#1E474D}
pre.code{margin:0;padding:10px 0 14px;overflow:auto;font:13.5px/1.6 var(--mono);color:var(--code-ink);flex:1}
pre.code .ln{display:block;padding:0 14px 0 0;white-space:pre;border-left:3px solid transparent}
pre.code .ln::before{content:attr(data-n);display:inline-block;width:3.2em;padding-right:1em;text-align:right;color:#4E6F74;user-select:none}
pre.code .ln.hl{background:var(--code-hl);border-left-color:var(--amber)}
pre.code .ln.hl::before{color:var(--amber)}
.t-kw{color:#FF9E64}.t-pp{color:#C79BF2}.t-num{color:#F7C873}.t-str{color:#A8E39A}.t-mr{color:#7DE3D1}.t-cm{color:#6E8B90}.t-ty{color:#82B8FF}
.bridge-cap{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bridge-cap h3{margin:0}
.hint{color:var(--muted);font-size:14px}
@media (max-width:760px){.bridge{grid-template-columns:1fr}.bridge .canvas{border-right:0;border-bottom:1px solid #C9D6D8}}
.bridge.code-only{grid-template-columns:minmax(0,1fr)}
.canvas .stack>.blk.top-next{margin-top:18px}

.notes{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.notes li{display:grid;grid-template-columns:minmax(0,auto) 1fr;gap:4px 12px;align-items:baseline;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.notes li button.chip{font:500 12.5px var(--mono);background:#E6EEEF;border:1px solid #CFDDDF;border-radius:6px;padding:2px 8px;cursor:pointer;text-align:left;max-width:min(52vw,520px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#0B4F55}
.notes li button.chip:hover,.notes li button.chip.on{background:var(--amber);border-color:var(--amber-d);color:#3a2a00}
@media (max-width:620px){.notes li{grid-template-columns:1fr}.notes li button.chip{max-width:100%}}

/* ---------- การ์ดบล็อก ---------- */
.bcards{display:grid;gap:12px}
.bcard{background:var(--paper);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden}
.bcard .canvas{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.bcard .info{padding:10px 18px 14px}
.bcard .info h3{font-size:16.5px}
.codeline{display:block;margin:6px 0;background:var(--code-bg);color:var(--code-ink);font:13px/1.55 var(--mono);padding:7px 10px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
.params{margin:6px 0 0;padding:0;list-style:none;font-size:14.5px}
.params li{margin:3px 0}
.params b{font-weight:600}
.warn{background:#FFF4D6;border:1px solid #F0D58A;border-radius:8px;padding:6px 10px;font-size:14.5px;margin-top:8px}
.warn::before{content:"ข้อควรรู้ · ";font-weight:700;color:#7A5600}
html:lang(en) .warn::before{content:"Note · "}
html:lang(lo) .warn::before{content:"ຂໍ້ຄວນຮູ້ · "}
details.vars{margin-top:8px;font-size:14px}
details.vars summary{cursor:pointer;color:var(--teal-d);font-weight:600}
table.vt{border-collapse:collapse;margin-top:6px;width:100%;font-size:13px}
table.vt td,table.vt th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.vt td code{white-space:pre-wrap;word-break:break-word}
@media (max-width:760px){.bcard{grid-template-columns:1fr}}

/* ---------- ลองทำ / แบบทดสอบ ---------- */
.tips{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 18px}
.tips ul{padding-left:20px;margin:8px 0}
.task{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0}
.task .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;font-size:14px;margin-right:8px}
.btn{border:1px solid var(--teal);background:#fff;color:var(--teal-d);border-radius:9px;padding:5px 14px;cursor:pointer;font-weight:600;font-size:14.5px}
.btn:hover{background:#E9F5F5}
.btn.solid{background:var(--teal);color:#fff}
.answer{margin-top:8px;background:#EAF6EF;border:1px solid #BFE2CC;border-radius:8px;padding:6px 10px;font-size:15px}
.quiz{display:grid;gap:12px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.q .qt{font-weight:600}
.q label{display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:8px;cursor:pointer}
.q label:hover{background:#F2F7F7}
.q input{margin-top:6px;accent-color:var(--teal)}
.q .fb{margin-top:6px;font-size:15px;border-radius:8px;padding:6px 10px;display:none}
.q.right .fb{display:block;background:#EAF6EF;border:1px solid #BFE2CC}
.q.wrong .fb{display:block;background:#FDEDEB;border:1px solid #F3C4BE}
.done-banner{display:none;margin-top:12px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px}
.done-banner.show{display:block}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}
.pager a{flex:1;min-width:220px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.pager a small{display:block;color:var(--muted)}
.pager a.next{text-align:right}

/* ---------- หน้าแรก ---------- */
.hero h1{font-size:clamp(30px,4.6vw,48px);margin-top:10px}
.hero .lead{font-size:18.5px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.ucard{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--u);border-radius:12px;padding:12px 16px}
.ucard .n{font:600 13px var(--mono);color:var(--muted)}
.ucard b{display:block;font-size:17.5px;margin:2px 0}
.ucard span{font-size:14px;color:var(--muted)}
.ucard.soon{opacity:.65}
.ucard ol{margin:8px 0 0;padding-left:20px;font-size:14px}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:10px}
.steps>li{counter-increment:s;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 16px 10px 56px;position:relative}
figure.shot{margin:12px 0 4px}
figure.shot img{display:block;width:100%;max-width:780px;height:auto;border-radius:10px;border:1px solid var(--line);background:#1b2124}
ul.need{display:grid;gap:6px;padding-left:22px}
dl.faq{display:grid;gap:8px;margin:8px 0 0}
dl.faq dt{font-weight:600;background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;padding:8px 12px 0}
dl.faq dd{margin:0;background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:2px 12px 10px}
p.next{margin-top:22px;font-size:17px}
.steps>li .bridge{margin-top:12px}
.steps>li::before{content:counter(s);position:absolute;left:14px;top:10px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:8px 0}
.legend span{display:flex;gap:6px;align-items:center}

/* ---------- ตารางอ้างอิง ---------- */
.search{width:100%;max-width:420px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;background:#fff}
.reftab{display:grid;gap:10px;margin-top:12px}
.refcat h2{display:flex;gap:10px;align-items:center}
.refcat h2 i{width:14px;height:14px;border-radius:4px;background:var(--u)}
footer{margin-top:60px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="burger"><button id="openNav" aria-label="เปิดเมนู">☰ บทเรียน</button><b id="burgerTitle">Mini R4: จากบล็อกสู่โค้ด</b></div>
<div class="app">
  <nav class="side" id="side" aria-label="บทเรียน"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<script id="data" type="application/json"></script>
<script>
'use strict';
let D = null;
const INLINE = document.getElementById('data').textContent.trim();
// หน้าไหนฝังไฟล์ในตัวเฟรม (เช่นตัวแสดงผลของ claude.ai) จะดาวน์โหลดไฟล์ไม่ได้ จึงซ่อนปุ่ม .ino
const FRAMED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
// หน้าจอยบังคับหุ่น: เว็บจริงอยู่ที่ rc/ ข้างหน้านี้ ไฟล์ offline ไม่มีโฟลเดอร์ rc จึงลิงก์ไปเว็บจริง (Bluetooth จากเว็บใช้ได้เฉพาะ https)
const RC_BASE = INLINE.startsWith('[') ? 'https://millerbankpbi.github.io/mini-r4-lessons/rc/' : 'rc/';
const IMG_BASE = INLINE.startsWith('[') ? 'https://millerbankpbi.github.io/mini-r4-lessons/img/' : 'img/';
const rcHref = preset => RC_BASE + '?' + (preset ? 'p=' + encodeURIComponent(preset) + '&' : '') + 'lang=' + SITE;
function fromRecords(recs) {
  const d = { units: [], lessons: [], blocks: {} };
  for (const r of recs) { if (r.kind === 'units') d.units = r.units; else if (r.kind === 'lesson') d.lessons.push(r.lesson); else if (r.kind === 'block') d.blocks[r.type] = r.block; }
  return d;
}
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
// ---------------- ภาษาของเว็บ (ไทย / English / ລາວ) ----------------
const SITES = [['th', 'ไทย'], ['en', 'English'], ['lo', 'ລາວ']];
const I18N = {
  th: {
    brand: 'Mini R4: จากบล็อกสู่โค้ด', brandSub: 'MATRIXblock คู่ Arduino', title: 'Mini R4: จากบล็อกสู่โค้ด — เรียน MATRIXblock คู่ Arduino',
    openNav: 'เปิดเมนู', navBtn: '☰ บทเรียน', navLabel: 'บทเรียน', langGroup: 'ภาษาของเว็บ',
    home: 'หน้าแรก', start: 'เริ่มต้น: บล็อก → Arduino IDE', ref: 'ตารางบล็อก ↔ โค้ด', rcBuilder: 'หน้าสร้างจอย',

const INSTALL = {"th": {"install": "ติดตั้งโปรแกรม", "installTitle": "ติดตั้งโปรแกรม", "installMore": "ดูขั้นตอนละเอียดพร้อมรูป → ติดตั้งโปรแกรม", "installHtml": "<h1>ติดตั้งโปรแกรม: Arduino IDE · บอร์ด R4 · ไลบรารี MatrixMiniR4<\/h1><p class=\"lead\">ทำครั้งเดียวต่อคอมพิวเตอร์หนึ่งเครื่อง ใช้เวลาราว 10–20 นาที (ขึ้นกับความเร็วอินเทอร์เน็ต) เสร็จแล้วเครื่องนี้อัปโหลดโค้ดทุกบทในเว็บนี้ลงหุ่น Mini R4 ได้<\/p><h2>ต้องมีอะไรบ้าง<\/h2><ul class=\"need\"><li>คอมพิวเตอร์ Windows 10/11 หรือ macOS ที่ต่ออินเทอร์เน็ต<\/li><li>หุ่น MATRIX Mini R4 กับสาย USB-C ที่ส่งข้อมูลได้ (สายสำหรับชาร์จอย่างเดียว คอมจะมองไม่เห็นหุ่น)<\/li><li>ภาพในหน้านี้มาจาก Arduino IDE 2.3.6 รุ่นอื่นในเวอร์ชัน 2 หน้าตาใกล้เคียงกัน<\/li><\/ul><h2>ขั้นตอน<\/h2><ol class=\"steps\"><li><b>ดาวน์โหลดและติดตั้ง Arduino IDE 2<\/b> จาก <a href=\"https://www.arduino.cc/en/software\" target=\"_blank\" rel=\"noopener\">arduino.cc/en/software<\/a> เลือกไฟล์ให้ตรงกับเครื่อง (Windows เลือกตัวติดตั้งสำหรับ Windows 10 ขึ้นไป) แล้วติดตั้งตามปกติ ถ้า Windows ถามว่าจะติดตั้งซอฟต์แวร์อุปกรณ์ (USB driver) ไหม ให้กด <b>Install<\/b> · เปิดโปรแกรมครั้งแรกอาจช้าสักพัก รอให้แถบด้านล่างโหลดเสร็จก่อน<\/li><li><b>เปิดตัวจัดการบอร์ด (Boards Manager)<\/b> กดไอคอนรูปบอร์ด ① ที่แถบซ้าย (ไอคอนที่ 2 จากบน) จะมีช่องค้นหา ② ขึ้นมา หรือใช้เมนู Tools → Board → Boards Manager…<figure class=\"shot\"><img src=\"{IMG}install-boards-manager.webp\" width=\"1060\" height=\"620\" loading=\"lazy\" alt=\"Arduino IDE: ไอคอนตัวจัดการบอร์ดที่แถบซ้าย (1) และช่องค้นหา (2)\"><\/figure><\/li><li><b>ติดตั้งบอร์ด Arduino UNO R4<\/b> พิมพ์ <code>arduino r4<\/code> ในช่องค้นหา ① จะเจอ <b>Arduino UNO R4 Boards<\/b> by Arduino กด <b>INSTALL<\/b> ② แล้วรอจนมีป้ายสีเขียว “1.6.0 installed” (อาจใช้เวลาหลายนาที) ถ้า Windows ถามเรื่องไดรเวอร์ระหว่างนี้ ให้กด Install<figure class=\"shot\"><img src=\"{IMG}install-uno-r4-boards.webp\" width=\"1060\" height=\"560\" loading=\"lazy\" alt=\"ค้นหา arduino r4 (1) แล้วกด INSTALL ที่ Arduino UNO R4 Boards (2)\"><\/figure><p class=\"warn\">เว็บนี้ทดสอบกับรุ่น 1.6.0 ถ้ารุ่นที่ใหม่กว่าคอมไพล์โค้ดในบทเรียนไม่ผ่าน ให้เลือก 1.6.0 ในช่องเลือกรุ่นข้างปุ่ม INSTALL แล้วติดตั้งใหม่<\/p><\/li><li><b>ติดตั้งไลบรารี MatrixMiniR4<\/b> กดไอคอนรูปหนังสือ ① (ไอคอนที่ 3 จากบน หรือเมนู Sketch → Include Library → Manage Libraries…) พิมพ์ <code>MatrixMiniR4<\/code> ในช่องค้นหา ② เลือก <b>MatrixMiniR4<\/b> by KKITC แล้วกด <b>INSTALL<\/b> ③ จะมีหน้าต่างถามว่าจะติดตั้งไลบรารีที่ต้องใช้ด้วยไหม (<b>ArduinoBLE<\/b> และ <b>PubSubClient<\/b>) ให้กด <b>INSTALL ALL<\/b> แล้วรอจนขึ้น “1.2.6 installed”<figure class=\"shot\"><img src=\"{IMG}install-matrixminir4.webp\" width=\"1060\" height=\"580\" loading=\"lazy\" alt=\"ไอคอนตัวจัดการไลบรารี (1) ค้นหา MatrixMiniR4 (2) แล้วกด INSTALL (3)\"><\/figure><p class=\"warn\">ถ้าเผลอกด INSTALL WITHOUT DEPENDENCIES ให้ค้น <code>ArduinoBLE<\/code> และ <code>PubSubClient<\/code> แล้วกด INSTALL ทีละตัว บทเรียนหน่วยที่ 6 (Bluetooth และ WiFi) ต้องใช้สองตัวนี้<\/p><\/li><li><b>ต่อหุ่น แล้วเลือกบอร์ดกับพอร์ต<\/b> เสียบสาย USB-C จากหุ่นเข้าคอมพิวเตอร์ กดช่องเลือกบอร์ดด้านบน ① → <b>Select other board and port…<\/b> ฝั่ง BOARDS พิมพ์ <code>uno r4 wifi<\/code> เลือก <b>Arduino UNO R4 WiFi<\/b> ฝั่ง PORTS เลือกพอร์ตของหุ่น (Windows เป็น COM เช่น COM5 · macOS เป็น /dev/cu.usbmodem…) แล้วกด OK · หรือใช้เมนู Tools → Board → Arduino UNO R4 Boards → Arduino UNO R4 WiFi และ Tools → Port<figure class=\"shot\"><img src=\"{IMG}install-toolbar.webp\" width=\"820\" height=\"182\" loading=\"lazy\" alt=\"ช่องเลือกบอร์ด (1) ปุ่มตรวจโค้ด (2) และปุ่มอัปโหลด (3) ที่แถบด้านบนของ Arduino IDE\"><\/figure><p class=\"warn\">ต้องเลือก <b>UNO R4 WiFi<\/b> (ไม่ใช่ Minima) · ไม่รู้ว่าพอร์ตไหนคือหุ่น: ถอดสายแล้วดูว่าพอร์ตไหนหายไป เสียบกลับ พอร์ตที่โผล่มาคือหุ่น<\/p><\/li><li><b>ทดสอบอัปโหลด: ตัวอย่าง “สวัสดี MATRIX”<\/b> โค้ดเบื้องต้นสำหรับโชว์ข้อความบนจอ ตั้งขนาดตัวอักษรครั้งเดียวใน <code>setup()<\/code> แล้วพิมพ์ 2 บรรทัด · กด File → New Sketch ลบโค้ดเดิมทั้งหมด วางโค้ดด้านล่าง (กดปุ่ม คัดลอก) กด ✓ Verify ② รอข้อความ “Done compiling” แล้วกด → Upload ③ รอ “Done uploading” · ถ้าจอ OLED ขึ้น <b>Hello<\/b> และ <b>MATRIX R4<\/b> สองบรรทัด แปลว่าติดตั้งครบ พร้อมเรียนแล้ว (ถ้าจอไม่ขึ้น ใส่แบตเตอรี่และเปิดสวิตช์หุ่นแล้วลองอีกครั้ง)<div id=\"testCode\"><\/div><p>อยากรู้ว่าแต่ละบรรทัดทำอะไร ดูบท <a href=\"#u1-oled\">จอ OLED: แสดงข้อความและตัวเลข<\/a><\/p><\/li><\/ol><h2>แก้ปัญหาที่พบบ่อย<\/h2><dl class=\"faq\"><dt><code>MatrixMiniR4.h: No such file or directory<\/code><\/dt><dd>ยังไม่ได้ติดตั้งไลบรารี MatrixMiniR4 (ขั้นที่ 4) หรือเลือกบอร์ดผิด ต้องเป็น Arduino UNO R4 WiFi (ขั้นที่ 5)<\/dd><dt><code>ArduinoBLE.h<\/code> หรือ <code>PubSubClient.h: No such file or directory<\/code><\/dt><dd>ติดตั้งไลบรารี ArduinoBLE และ PubSubClient เพิ่ม (ดูข้อควรรู้ในขั้นที่ 4)<\/dd><dt>ไม่มีพอร์ตให้เลือก หรือขึ้น “No device found”<\/dt><dd>เปลี่ยนเป็นสายที่ส่งข้อมูลได้ ลองช่อง USB อื่น ถอดเสียบใหม่แล้วเลือกพอร์ตอีกครั้ง และปิดโปรแกรมอื่นที่อาจใช้พอร์ตอยู่ เช่น MATRIXblock หรือ Serial Monitor ในอีกหน้าต่าง<\/dd><dt>ค้างที่ “Uploading…” นาน หรืออัปโหลดไม่สำเร็จ<\/dt><dd>ถอดสายเสียบใหม่ เลือกพอร์ตอีกครั้ง แล้วกดอัปโหลดใหม่<\/dd><dt>ติดตั้งบอร์ดหรือไลบรารีไม่สำเร็จ (ดาวน์โหลดล้มเหลว)<\/dt><dd>อินเทอร์เน็ตของโรงเรียนอาจบล็อกเว็บดาวน์โหลด ลองต่อฮอตสปอตมือถือ แล้วกด INSTALL อีกครั้ง<\/dd><dt>ไม่แน่ใจว่าติดตั้งแล้วหรือยัง<\/dt><dd>ค้นชื่อในตัวจัดการบอร์ดหรือตัวจัดการไลบรารี ถ้าติดตั้งแล้วจะมีป้ายสีเขียว “… installed”<\/dd><\/dl><p class=\"next\">ติดตั้งเสร็จแล้ว ต่อไปดู <a href=\"#start\">เริ่มต้น: ย้ายโค้ดจากบล็อกไป Arduino IDE<\/a><\/p>"}, "en": {"install": "Install the software", "installTitle": "Install the software", "installMore": "Step-by-step with pictures → Install the software", "installHtml": "<h1>Install the software: Arduino IDE · R4 board · MatrixMiniR4 library<\/h1><p class=\"lead\">Do this once per computer. It takes about 10–20 minutes, depending on your internet speed. After that, this computer can upload every lesson on this site to the Mini R4 robot.<\/p><h2>What you need<\/h2><ul class=\"need\"><li>A Windows 10/11 or macOS computer with internet<\/li><li>A MATRIX Mini R4 robot and a USB-C cable that carries data (a charge-only cable will not show the robot)<\/li><li>The pictures on this page come from Arduino IDE 2.3.6; other version 2 releases look about the same<\/li><\/ul><h2>Steps<\/h2><ol class=\"steps\"><li><b>Download and install Arduino IDE 2<\/b> from <a href=\"https://www.arduino.cc/en/software\" target=\"_blank\" rel=\"noopener\">arduino.cc/en/software<\/a>. Pick the file for your computer (on Windows, the installer for Windows 10 and newer) and install it as usual. If Windows asks whether to install device software (USB driver), press <b>Install<\/b>. The first start can be slow; wait until the bar at the bottom finishes loading.<\/li><li><b>Open the Boards Manager<\/b>: press the board icon ① in the left bar (second icon from the top). A search box ② appears. You can also use Tools → Board → Boards Manager…<figure class=\"shot\"><img src=\"{IMG}install-boards-manager.webp\" width=\"1060\" height=\"620\" loading=\"lazy\" alt=\"Arduino IDE: the Boards Manager icon in the left bar (1) and the search box (2)\"><\/figure><\/li><li><b>Install the Arduino UNO R4 board<\/b>: type <code>arduino r4<\/code> in the search box ①. You will find <b>Arduino UNO R4 Boards<\/b> by Arduino. Press <b>INSTALL<\/b> ② and wait for the green “1.6.0 installed” label (this can take several minutes). If Windows asks about a driver meanwhile, press Install.<figure class=\"shot\"><img src=\"{IMG}install-uno-r4-boards.webp\" width=\"1060\" height=\"560\" loading=\"lazy\" alt=\"Search for arduino r4 (1), then press INSTALL on Arduino UNO R4 Boards (2)\"><\/figure><p class=\"warn\">This site was tested with version 1.6.0. If a newer version fails to compile the lesson code, pick 1.6.0 in the version box next to INSTALL and install again.<\/p><\/li><li><b>Install the MatrixMiniR4 library<\/b>: press the book icon ① (third icon from the top, or Sketch → Include Library → Manage Libraries…). Type <code>MatrixMiniR4<\/code> in the search box ②, pick <b>MatrixMiniR4<\/b> by KKITC and press <b>INSTALL<\/b> ③. A window asks whether to install the libraries it needs as well (<b>ArduinoBLE<\/b> and <b>PubSubClient<\/b>): press <b>INSTALL ALL<\/b> and wait for “1.2.6 installed”.<figure class=\"shot\"><img src=\"{IMG}install-matrixminir4.webp\" width=\"1060\" height=\"580\" loading=\"lazy\" alt=\"The Library Manager icon (1), search for MatrixMiniR4 (2), then press INSTALL (3)\"><\/figure><p class=\"warn\">If you pressed INSTALL WITHOUT DEPENDENCIES by mistake, search for <code>ArduinoBLE<\/code> and <code>PubSubClient<\/code> and install each one. Unit 6 (Bluetooth and WiFi) needs both.<\/p><\/li><li><b>Connect the robot, then choose the board and port<\/b>: plug the robot’s USB-C cable into the computer. Press the board box at the top ① → <b>Select other board and port…<\/b>. Under BOARDS type <code>uno r4 wifi<\/code> and pick <b>Arduino UNO R4 WiFi<\/b>; under PORTS pick the robot’s port (COM on Windows, such as COM5 · /dev/cu.usbmodem… on macOS), then press OK. You can also use Tools → Board → Arduino UNO R4 Boards → Arduino UNO R4 WiFi and Tools → Port.<figure class=\"shot\"><img src=\"{IMG}install-toolbar.webp\" width=\"820\" height=\"182\" loading=\"lazy\" alt=\"The board box (1), the Verify button (2) and the Upload button (3) at the top of Arduino IDE\"><\/figure><p class=\"warn\">Choose <b>UNO R4 WiFi<\/b> (not Minima). Not sure which port is the robot? Unplug the cable and see which port disappears; plug it back in and the port that appears is the robot.<\/p><\/li><li><b>Test an upload: the “Hello MATRIX” example<\/b>, a first sketch that shows text on the screen. It sets the text size once in <code>setup()<\/code>, then prints 2 lines. Press File → New Sketch, delete all the code, paste the code below (press Copy), press ✓ Verify ② and wait for “Done compiling”, then press → Upload ③ and wait for “Done uploading”. If the OLED screen shows <b>Hello<\/b> and <b>MATRIX R4<\/b> on two lines, everything is installed and you are ready to learn. (If the screen stays blank, put in the battery, switch the robot on and try again.)<div id=\"testCode\"><\/div><p>To learn what each line does, see the lesson <a href=\"#u1-oled\">OLED screen: showing text and numbers<\/a>.<\/p><\/li><\/ol><h2>Common problems<\/h2><dl class=\"faq\"><dt><code>MatrixMiniR4.h: No such file or directory<\/code><\/dt><dd>The MatrixMiniR4 library is not installed (step 4), or the wrong board is chosen; it must be Arduino UNO R4 WiFi (step 5).<\/dd><dt><code>ArduinoBLE.h<\/code> or <code>PubSubClient.h: No such file or directory<\/code><\/dt><dd>Install the ArduinoBLE and PubSubClient libraries (see the note in step 4).<\/dd><dt>No port to choose, or “No device found”<\/dt><dd>Use a cable that carries data, try another USB socket, unplug and plug in again and choose the port again, and close other programs that may hold the port, such as MATRIXblock or a Serial Monitor in another window.<\/dd><dt>Stuck at “Uploading…” or the upload fails<\/dt><dd>Unplug and plug in the cable, choose the port again, then upload again.<\/dd><dt>Installing the board or library fails (download failed)<\/dt><dd>The school internet may block the download site. Try a phone hotspot, then press INSTALL again.<\/dd><dt>Not sure whether it is installed<\/dt><dd>Search for the name in the Boards Manager or Library Manager. Installed items show a green “… installed” label.<\/dd><\/dl><p class=\"next\">All installed? Next, see <a href=\"#start\">Getting started: from blocks to Arduino IDE<\/a><\/p>"}, "lo": {"install": "ຕິດຕັ້ງໂປຣແກຣມ", "installTitle": "ຕິດຕັ້ງໂປຣແກຣມ", "installMore": "ເບິ່ງຂັ້ນຕອນລະອຽດພ້ອມຮູບ → ຕິດຕັ້ງໂປຣແກຣມ", "installHtml": "<h1>ຕິດຕັ້ງໂປຣແກຣມ: Arduino IDE · ບອດ R4 · ຫ້ອງສະໝຸດ MatrixMiniR4<\/h1><p class=\"lead\">ເຮັດເທື່ອດຽວຕໍ່ຄອມພິວເຕີໜຶ່ງເຄື່ອງ ໃຊ້ເວລາປະມານ 10–20 ນາທີ (ຂຶ້ນກັບຄວາມໄວອິນເຕີເນັດ) ເມື່ອເຮັດແລ້ວ ເຄື່ອງນີ້ອັບໂຫຼດໂຄ້ດທຸກບົດໃນເວັບນີ້ລົງຫຸ່ນຍົນ Mini R4 ໄດ້<\/p><h2>ຕ້ອງມີຫຍັງແດ່<\/h2><ul class=\"need\"><li>ຄອມພິວເຕີ Windows 10/11 ຫຼື macOS ທີ່ຕໍ່ອິນເຕີເນັດ<\/li><li>ຫຸ່ນຍົນ MATRIX Mini R4 ກັບສາຍ USB-C ທີ່ສົ່ງຂໍ້ມູນໄດ້ (ສາຍສຳລັບສາກໄຟຢ່າງດຽວ ຄອມຈະເບິ່ງບໍ່ເຫັນຫຸ່ນຍົນ)<\/li><li>ຮູບໃນໜ້ານີ້ມາຈາກ Arduino IDE 2.3.6 ລຸ້ນອື່ນໃນເວີຊັນ 2 ໜ້າຕາໃກ້ຄຽງກັນ<\/li><\/ul><h2>ຂັ້ນຕອນ<\/h2><ol class=\"steps\"><li><b>ດາວໂຫຼດ ແລະ ຕິດຕັ້ງ Arduino IDE 2<\/b> ຈາກ <a href=\"https://www.arduino.cc/en/software\" target=\"_blank\" rel=\"noopener\">arduino.cc/en/software<\/a> ເລືອກໄຟລ໌ໃຫ້ກົງກັບເຄື່ອງ (Windows ເລືອກຕົວຕິດຕັ້ງສຳລັບ Windows 10 ຂຶ້ນໄປ) ແລ້ວຕິດຕັ້ງຕາມປົກກະຕິ ຖ້າ Windows ຖາມວ່າຈະຕິດຕັ້ງຊອບແວອຸປະກອນ (USB driver) ບໍ່ ໃຫ້ກົດ <b>Install<\/b> · ເປີດໂປຣແກຣມເທື່ອທຳອິດອາດຊ້າໄລຍະໜຶ່ງ ລໍໃຫ້ແຖບທາງລຸ່ມໂຫຼດແລ້ວກ່ອນ<\/li><li><b>ເປີດຕົວຈັດການບອດ (Boards Manager)<\/b> ກົດໄອຄອນຮູບບອດ ① ທີ່ແຖບຊ້າຍ (ໄອຄອນທີ 2 ຈາກເທິງ) ຈະມີຊ່ອງຄົ້ນຫາ ② ຂຶ້ນມາ ຫຼື ໃຊ້ເມນູ Tools → Board → Boards Manager…<figure class=\"shot\"><img src=\"{IMG}install-boards-manager.webp\" width=\"1060\" height=\"620\" loading=\"lazy\" alt=\"Arduino IDE: ໄອຄອນຕົວຈັດການບອດທີ່ແຖບຊ້າຍ (1) ແລະ ຊ່ອງຄົ້ນຫາ (2)\"><\/figure><\/li><li><b>ຕິດຕັ້ງບອດ Arduino UNO R4<\/b> ພິມ <code>arduino r4<\/code> ໃນຊ່ອງຄົ້ນຫາ ① ຈະພົບ <b>Arduino UNO R4 Boards<\/b> by Arduino ກົດ <b>INSTALL<\/b> ② ແລ້ວລໍຈົນມີປ້າຍສີຂຽວ “1.6.0 installed” (ອາດໃຊ້ເວລາຫຼາຍນາທີ) ຖ້າ Windows ຖາມເລື່ອງໄດຣເວີລະຫວ່າງນີ້ ໃຫ້ກົດ Install<figure class=\"shot\"><img src=\"{IMG}install-uno-r4-boards.webp\" width=\"1060\" height=\"560\" loading=\"lazy\" alt=\"ຄົ້ນຫາ arduino r4 (1) ແລ້ວກົດ INSTALL ທີ່ Arduino UNO R4 Boards (2)\"><\/figure><p class=\"warn\">ເວັບນີ້ທົດສອບກັບລຸ້ນ 1.6.0 ຖ້າລຸ້ນໃໝ່ກວ່າຄອມໄພລ໌ໂຄ້ດໃນບົດຮຽນບໍ່ຜ່ານ ໃຫ້ເລືອກ 1.6.0 ໃນຊ່ອງເລືອກລຸ້ນຂ້າງປຸ່ມ INSTALL ແລ້ວຕິດຕັ້ງໃໝ່<\/p><\/li><li><b>ຕິດຕັ້ງຫ້ອງສະໝຸດ MatrixMiniR4<\/b> ກົດໄອຄອນຮູບປຶ້ມ ① (ໄອຄອນທີ 3 ຈາກເທິງ ຫຼື ເມນູ Sketch → Include Library → Manage Libraries…) ພິມ <code>MatrixMiniR4<\/code> ໃນຊ່ອງຄົ້ນຫາ ② ເລືອກ <b>MatrixMiniR4<\/b> by KKITC ແລ້ວກົດ <b>INSTALL<\/b> ③ ຈະມີໜ້າ const KW = /\b(void|if|else|for|while|return|true|false|int|float|bool|const|unsigned|long|char|String|HIGH|LOW)\b/;
function hiLine(s) {
  if (/^\s*#/.test(s)) return '<span class="t-pp">' + esc(s) + '</span>';
  let out = '', i = 0;
  const re = /("(?:\\.|[^"\\])*")|(\/\/.*$)|(\b\d+(?:\.\d+)?\b)|(\bMiniR4\b(?:\.[A-Za-z_]\w*)*)|(\b(?:void|if|else|for|while|return|true|false)\b)|(\b(?:int|float|bool|String|unsigned|long|char)\b)|(\b[A-Z][A-Z0-9_]{2,}\b)/g;
  let m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(i, m.index));
    const cls = m[1] ? 't-str' : m[2] ? 't-cm' : m[3] ? 't-num' : m[4] ? 't-mr' : m[5] ? 't-kw' : m[6] ? 't-ty' : 't-pp';

}

function findNode(stacks, id) {

  const walk = n => { if (hit) return; if (n.id === id) { hit = n; return; } for (const r of n.rows) { for (const it of r.items || []) if (it.k === 'val') walk(it.b); for (const b of r.blocks || []) walk(b); } };
  for (const s of stacks) for (const n of s) walk(n);

}
function bridge(ex, opts = {}) {
  const lines = ex.code.replace(/\n+$/, '').split('\n');

  const cv = document.createElement('div'); cv.className = 'canvas';

  cb.innerHTML = '<div class="codebar"><span>' + esc(opts.file || 'sketch.ino') + '</span><span class="sp"></span><button data-act="copy">' + U('copy') + '</button>' + (FRAMED ? '' : '<button data-act="dl">.ino</button>') + '</div>';
  const pre = document.createElement('pre'); pre.className = 'code'; pre.tabIndex = 0;
  pre.setAttribute('aria-label', U('codeAria'));
  pre.innerHTML = lines.map((l, i) => '<span class="ln" data-n="' + (i + 1) + '">' + (hiLine(l) || ' ') + '</span>').join('');
  cb.appendChild(pre);
  if (ex.codeOnly) box.append(cb); else box.append(cv, cb);
  const lnEls = [...pre.querySelectorAll('.ln')];
  const stacks = ex.en;
  // ช่วงบรรทัดของแต่ละบล็อก (บล็อกค่าใช้บรรทัดของบล็อกแม่)
  const rangeOf = el => {
    while (el && el !== cv) {
      if (el.classList && el.classList.contains('blk')) {
        const id = el.dataset.id, t = el.dataset.type, extra = extraLines(t, el, lines);
        if (ex.ranges[id]) return [[ex.ranges[id][0], ex.ranges[id][1]], ...extra];
        if (extra.length) return extra;
      }
      el = el.parentElement;
    }
    return [];
  };
  function extraLines(type, el, L) {
    const out = [];
    const findAll = rx => L.forEach((l, i) => { if (rx.test(l)) out.push([i, i]); });
    if (type === 'mini_setup') { findAll(/^void (setup|loop)\(\)|MiniR4\.begin\(\)|setBattCell|^\s*Serial\.begin/); }
    if (type === 'mini_ddc_setting') findAll(/^#define ENABLE_DRIVEDC/);
    if (/^data_/.test(type)) { const v = el.querySelector('.dd'); if (v) findAll(new RegExp('^float ' + v.textContent.replace(/\W/g, '') + ';')); }
    return out;
  }
  const clear = () => { cv.querySelectorAll('.blk.hl').forEach(b => b.classList.remove('hl')); lnEls.forEach(l => l.classList.remove('hl')); };
  const showRanges = rs => { for (const [a, b] of rs) for (let i = a; i <= b; i++) lnEls[i] && lnEls[i].classList.add('hl'); };
  cv.addEventListener('mouseover', e => {
    const b = e.target.closest('.blk'); clear(); if (!b) return;

  const blockForLine = n => {
    let best = null, size = 1e9;
    for (const id in ex.ranges) { const [a, b] = ex.ranges[id]; if (n >= a && n <= b && b - a < size) { best = id; size = b - a; } }
    return best;
  };
  pre.addEventListener('mouseover', e => {
    const ln = e.target.closest('.ln'); clear(); if (!ln) return;
    const n = lnEls.indexOf(ln), id = blockForLine(n);
    if (!id) { ln.classList.add('hl'); return; }
    const el = cv.querySelector('.blk[data-id="' + id + '"]'); if (el) el.classList.add('hl');
    showRanges([ex.ranges[id]]);

    setTimeout(() => btn.textContent = U('copy'), 1600);
  };

    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ex.code], { type: 'text/plain' }));

  };

  const h2 = document.createElement('h2'); h2.textContent = U('how'); v.appendChild(h2);
  const st = document.createElement('ol'); st.className = 'steps';
  st.innerHTML = U('steps');
  v.appendChild(st);
  v.appendChild(footer());
}

function startPage() {
  const v = $('#view');
  v.innerHTML = '<div class="crumb"><a href="#home">' + U('home') + '</a></div>' + U('startHtml');
  const firstSteps = v.querySelector('ol.steps');
  if (firstSteps) firstSteps.insertAdjacentHTML('afterend', '<p><a href="#install">' + U('installMore') + '</a></p>');
  v.appendChild(bridge(D.lessons[0].examples[0], { file: 'empty.ino' }));
  v.appendChild(footer());
}

function installPage() {
  const v = $('#view');
  v.innerHTML = '<div class="crumb"><a href="#home">' + U('home') + '</a></div>' + U('installHtml').split('{IMG}').join(IMG_BASE);
  const slot = $('#testCode');
  if (slot) slot.replaceWith(bridge({ code: INSTALL_TEST, codeOnly: true, ranges: {}, en: [] }, { file: 'u1-oled-1.ino' }));
  v.appendChild(footer());
}

function refPage() {
  const v = $('#view');
  v.innerHTML = '<div class="crumb"><a href="#home">' + U('home') + '</a></div><h1>' + U('ref') + '</h1><p class="lead">' + U('refLead') + '</p>' +
    '<input class="search" id="q" type="search" placeholder="' + U('search') + '" aria-label="' + U('search') + '">';
  const body = document.createElement('div'); v.appendChild(body);
  const order = ['core', 'move', 'looks', 'control', 'ops', 'vars', 'iot', 'serial', 'sensing'];
  const draw = q => {
    body.innerHTML = '';
    q = (q || '').toLowerCase();
    for (const c of order) {
      const types = Object.keys(D.blocks).filter(t => D.blocks[t].cat === c && (!q || (t + ' ' + D.blocks[t].name + ' ' + (D.blocks[t].value || D.blocks[t].program) + ' ' + D.blocks[t].desc).toLowerCase().includes(q)));
      if (!types.length) continue;
      const sec = document.createElement('section'); sec.className = 'refcat'; sec.style.setProperty('--u', CAT[c][1]);
      sec.innerHTML = '<h2><i></i>' + CAT[c][0] + (c === 'serial' || c === 'sensing' ? ' <span class="hint">' + U('later') + '</span>' : '') + '</h2>';
      const g = document.createElement('div'); g.className = 'reftab';
      types.forEach(t => g.appendChild(blockCard(t)));
      sec.appendChild(g); body.appendChild(sec);
    }
    if (!body.children.length) body.innerHTML = '<p>' + U('notFound') + '</p>';
  };
  draw('');
  $('#q').addEventListener('input', e => draw(e.target.value));
  v.appendChild(footer());
}

function footer() {
  const f = document.createElement('footer');
  f.innerHTML = U('footer');
  return f;
}

// ---------------- เส้นทาง ----------------
function route(keepScroll) {
  const h = location.hash.replace(/^#\/?(l\/)?/, '');
  const y = window.scrollY;
  const les = D.lessons.find(l => l.id === h);
  if (les) { renderSide(les.id); lessonPage(les); document.title = les.title.replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>') + ' · ' + U('brand'); }
  else if (h === 'start') { renderSide('start'); startPage(); document.title = U('startTitle') + ' · ' + U('brand'); }
  else if (h === 'install') { renderSide('install'); installPage(); document.title = U('installTitle') + ' · ' + U('brand'); }
  else if (h === 'ref') { renderSide('ref'); refPage(); document.title = U('ref') + ' · ' + U('brand'); }
  else { renderSide('home'); homePage(); document.title = U('title'); }
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => route(false));
applyStatic();
(async () => {
  try {
    RAW = fromRecords(INLINE.startsWith('[') ? JSON.parse(INLINE) : await (await fetch('data.json')).json());
    D = localize(SITE);
  } catch (e) {
    $('#view').innerHTML = U('loadErr');
    return;
  }
  route(false);
})();
</script>
</body>
